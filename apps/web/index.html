<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mudbrick</title>
  </head>
  <body>
    <div id="titleScreen">
      <h1>Mudbrick</h1>
      <div id="titleMenu"></div>
      <p id="titleNote">
        Mudbrick needs the art and rules from your own installed copy of the original game. Files
        are read in your browser only. Nothing is uploaded.
      </p>
    </div>
    <div id="game" hidden>
      <div id="menuBar"></div>
      <div id="gameMain">
        <div id="mapWrap"><canvas id="map"></canvas></div>
        <aside id="panel">
          <div class="panelBox">
            <div class="panelTitle">World</div>
            <canvas id="minimap"></canvas>
          </div>
          <div id="statusBox" class="panelBox">
            <div class="panelTitle">Status</div>
            <div id="status"></div>
            <div id="unitPanel"></div>
          </div>
          <div id="logBox" class="panelBox">
            <div id="log"></div>
          </div>
        </aside>
      </div>
    </div>
    <div id="cityWindow" hidden></div>
    <div id="editor" hidden>
      <div id="editorBar">
        <button id="edBack">Back</button>

        <label
          >Size
          <select id="edSize">
            <option value="40x50">small</option>
            <option value="50x80" selected>normal</option>
            <option value="75x120">large</option>
          </select></label
        >
        <button id="edNew">Blank map</button>
        <label
          >Brush
          <select id="edBrush"></select>
        </label>
        <button id="edSave">Save .MP</button>
        <span class="hint">Click the map to paint. Save it, then use Start on Premade World.</span>
      </div>
      <div id="editorScroll"><canvas id="editCanvas"></canvas></div>
    </div>
    <div id="setup" hidden>
      <input id="folder" type="file" webkitdirectory multiple />
      <input id="gameFile" type="file" accept=".sav,.SAV,.scn,.SCN,.net,.NET,.json,.mp,.MP" />
      <div id="newGamePanel">
        <div>
          <label
            >World
            <select id="ngSize">
              <option value="40x50">small 40×50</option>
              <option value="50x80" selected>normal 50×80</option>
              <option value="75x120">large 75×120</option>
              <option value="custom">custom</option>
            </select></label
          >
          <label id="ngCustomSize" hidden
            >columns <input id="ngColumns" type="number" min="20" max="250" value="50" /> rows
            <input id="ngRows" type="number" min="20" max="250" value="80"
          /></label>
          <label><input id="ngFlat" type="checkbox" /> flat</label>
          <label
            >Land mass
            <select id="ngLand">
              <option value="0">small</option>
              <option value="1" selected>normal</option>
              <option value="2">large</option>
            </select></label
          >
          <label
            >Land form
            <select id="ngForm">
              <option value="-1">archipelago</option>
              <option value="0" selected>varied</option>
              <option value="1">continents</option>
            </select></label
          >
          <label
            >Climate
            <select id="ngClimate">
              <option value="-1">arid</option>
              <option value="0" selected>normal</option>
              <option value="1">wet</option>
            </select></label
          >
          <label
            >Temperature
            <select id="ngTemp">
              <option value="-1">cool</option>
              <option value="0" selected>temperate</option>
              <option value="1">warm</option>
            </select></label
          >
          <label
            >Age
            <select id="ngAge">
              <option value="0">3 billion years</option>
              <option value="1" selected>4 billion years</option>
              <option value="2">5 billion years</option>
            </select></label
          >
          <label
            >Difficulty
            <select id="ngDifficulty"></select
          ></label>
          <label
            >Civilizations
            <select id="ngCivs">
              <option value="0">random</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7" selected>7</option>
            </select></label
          >
          <label
            >Leader
            <select id="ngGender">
              <option value="">as the tribe's</option>
              <option value="m">male</option>
              <option value="f">female</option>
            </select></label
          >
          <label
            >Tribe
            <select id="ngTribe"></select
          ></label>
          <details>
            <summary>Own tribe</summary>
            <label>Leader <input id="ngLeader" maxlength="23" /></label>
            <label>Tribe <input id="ngTribeName" maxlength="23" /></label>
            <label>Adjective <input id="ngAdjective" maxlength="23" /></label>
            <label
              >Titles, seven with commas, Anarchy to Democracy <input id="ngTitles" maxlength="170"
            /></label>
            <label
              >City style
              <select id="ngStyle">
                <option value="">as the tribe</option>
                <option value="0">Bronze Age</option>
                <option value="1">Classical</option>
                <option value="2">Far East</option>
                <option value="3">Medieval</option>
              </select></label
            >
          </details>
          <label
            >Barbarians
            <select id="ngBarb">
              <option value="0">villages only</option>
              <option value="1" selected>roving bands</option>
              <option value="2">restless tribes</option>
              <option value="3">raging hordes</option>
            </select></label
          >
          <label>
            Human players
            <select id="ngHumans">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
              <option>7</option>
            </select>
          </label>
          <label
            >Start
            <select id="ngStart">
              <option value="0" selected>from the beginning</option>
              <option value="1">accelerated, turn 21</option>
              <option value="2">accelerated, turn 41</option>
            </select></label
          >
          <label><input id="ngSimple" type="checkbox" /> Simplified combat</label>
          <label><input id="ngBloodlust" type="checkbox" /> Bloodlust</label>
          <label><input id="ngNoRestart" type="checkbox" /> Don't restart eliminated players</label>
          <label><input id="ngByFile" type="checkbox" /> Play by file</label>
          <label><input id="ngRandomWorld" type="checkbox" /> Random world</label>
          <label><input id="ngOnMap" type="checkbox" /> Start on the map loaded now</label>
          <label><input id="ngOpponents" type="checkbox" /> Select computer opponents</label>
          <label><input id="ngOpenGame" type="checkbox" /> Open game: players can join later</label>
          <label><input id="ngSimultaneous" type="checkbox" /> Humans move simultaneously</label>
          <label><input id="ngDoubleProduction" type="checkbox" /> Double terrain production</label>
          <label><input id="ngDoubleMoves" type="checkbox" /> Double ground unit moves</label>
          <label><input id="ngShowStarts" type="checkbox" /> Show human starting positions</label>
          <label
            ><input id="ngKillRetire" type="checkbox" /> Remove a civilization on retirement</label
          >
          <button id="newGame" disabled title="Needs the game folder for the rules and tiles">
            Start
          </button>
        </div>
      </div>
      <div id="netPanel">
        <label>Relay <input id="netUrl" value="ws://localhost:8787" /></label>
        <label>Room <input id="netRoom" value="game" size="8" /></label>
        <label>Seat <input id="netSeat" value="1" size="2" /></label>
        <span id="netStatus"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
