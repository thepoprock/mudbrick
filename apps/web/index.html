<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mudbrick — world viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        background: #14161a;
        color: #ddd;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        padding: 0.75rem 1rem;
        background: #1e2228;
        border-bottom: 1px solid #333;
      }
      header label {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
      }
      main {
        padding: 1rem;
        overflow: auto;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
        display: block;
      }
      #info {
        font-family: ui-monospace, monospace;
        white-space: pre;
        margin: 0 0 0.75rem;
        min-height: 4.5em;
        color: #9fb;
      }
      .hint {
        color: #888;
      }
      #status {
        color: #cb8;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Mudbrick · world viewer</strong>
      <label>1. Game folder <input id="folder" type="file" webkitdirectory multiple /></label>
      <label
        >2. Map or game
        <input id="gameFile" type="file" accept=".mp,.MP,.sav,.SAV,.scn,.SCN,.hot,.HOT,.net,.NET"
      /></label>
      <label
        >Zoom
        <select id="zoom">
          <option value="0.25">¼</option>
          <option value="0.5">½</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
        </select></label
      >
      <label><input id="showCities" type="checkbox" checked /> cities</label>
      <label><input id="showUnits" type="checkbox" checked /> units</label>
      <span id="status"></span>
      <span id="dev"></span>
      <span class="hint">Files are read in your browser only. Nothing is uploaded.</span>
    </header>
    <main>
      <p id="info">
        Pick the folder of your own installed copy (the one with RULES.TXT), then a .MP map or a
        .SAV/.SCN game.
      </p>
      <canvas id="map" width="0" height="0"></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
